<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kevin's Monthly Schedule Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; color: #333; }
    .dropzone { border: 2px dashed #0070f3; border-radius: 8px; padding: 40px; text-align: center; background: #f7f9fa; cursor: pointer; transition: background 0.2s, border-color 0.2s; }
    .dropzone.dragover { background: #e6f0ff; border-color: #0051a3; }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; background: #0070f3; color: white; border: none; padding: 12px 15px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #log { margin-top: 20px; white-space: pre-wrap; font-family: monospace; font-size: 13px; background: #eee; padding: 12px; border-radius: 4px; max-height: 250px; overflow-y: auto; }
  </style>
</head>
<body>

  <h2>Kevin's Monthly Schedule Generator</h2>
  <div class="dropzone" id="dropzone">
    <p>📄 Drop schedule PDFs here or click to upload</p>
    <input type="file" id="fileInput" multiple accept="application/pdf" style="display:none">
  </div>

  <div class="btn-group">
    <button id="icsBtn" disabled>📅 Generate .ICS Calendar</button>
    <button id="pdfBtn" disabled>📄 Generate Calendar PDF</button>
  </div>

  <div id="log">Upload PDFs to begin...</div>

  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    }

    const locationMap = {
      'CY': 'Central Yard (CY)',
      'KT': 'Kennedy Town (KT)',
      'SK': 'Sai Kung (SK)',
      'OIE': 'Quarry Bay (OIE)',
      'PP': 'Pacific Place (PP)'
    };

    const monthMap = {
      'JAN': '01', 'FEB': '02', 'MAR': '03', 'APR': '04',
      'MAY': '05', 'JUN': '06', 'JUL': '07', 'AUG': '08',
      'SEP': '09', 'SEPT': '09', 'OCT': '10', 'NOV': '11', 'DEC': '12'
    };

    const dayNames = ["Mon", "Tue", "Wed", "Thur", "Fri", "Sat", "Sun"];

    let filesList = [];
    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    const icsBtn = document.getElementById('icsBtn');
    const pdfBtn = document.getElementById('pdfBtn');
    const log = document.getElementById('log');

    dropzone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    ['dragenter', 'dragover'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.remove('dragover');
      }, false);
    });

    dropzone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      handleFiles(files);
    });

    function handleFiles(files) {
      filesList = Array.from(files).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
      if (filesList.length > 0) {
        log.textContent = `Selected ${filesList.length} PDF file(s):\n` + filesList.map(f => `- ${f.name}`).join('\n');
        icsBtn.disabled = false;
        pdfBtn.disabled = false;
      } else {
        log.textContent = "No valid PDF files detected. Please ensure you are uploading .pdf files.";
        icsBtn.disabled = true;
        pdfBtn.disabled = true;
      }
    }

    function extractMetadataFromFileName(filename) {
      let defaultLoc = 'Pacific Place (PP)';
      let defaultLocCode = 'PP';
      let year = '2026';
      let monthStr = 'SEPT';
      let month = '09';

      for (let code in locationMap) {
        let regex = new RegExp(`[\\b_]${code}[\\b_.]`, 'i');
        if (regex.test(filename)) {
          defaultLoc = locationMap[code];
          defaultLocCode = code;
          break;
        }
      }

      let yearMatch = filename.match(/\b(202\d)\b/);
      if (yearMatch) year = yearMatch[1];

      for (let m in monthMap) {
        if (filename.toUpperCase().includes(m)) {
          monthStr = m;
          month = monthMap[m];
          break;
        }
      }

      return { defaultLoc, defaultLocCode, year, month, monthStr };
    }

    async function parseWeeklySchedules() {
      log.textContent = "Processing PDF pages...\n";
      let weeklyData = [];
      let detectedMeta = { monthStr: 'SEPT', year: '2026' };

      for (let file of filesList) {
        try {
          const fileMeta = extractMetadataFromFileName(file.name);
          detectedMeta = fileMeta;

          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          
          for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const textContent = await page.getTextContent();
            
            let items = textContent.items.map(item => ({
              x: Math.round(item.transform[4]),
              y: Math.round(item.transform[5]),
              str: item.str.trim()
            })).filter(i => i.str.length > 0);

            let weekItem = items.find(i => /^WEEK\s*\d+$/i.test(i.str) \vert{}\vert{} (i.str === "WEEK" && items.some(k => /^\d{1,2}$/.test(k.str) && Math.abs(k.y - i.y) < 5)));
            let weekLabel = weekItem ? weekItem.str : `Page ${pageNum}`;

            let headers = [];
            dayNames.forEach(d => {
              let found = items.find(i => i.str === d);
              if (found) headers.push({ name: d, x: found.x, y: found.y });
            });

            if (headers.length < 5) continue;
            headers.sort((a, b) => a.x - b.x);

            let minX = headers[0].x - 15;
            let maxX = headers[headers.length - 1].x + 35;
            let headerY = headers[0].y;

            let columns = [];
            headers.forEach(h => {
              let dateItem = items.find(i => /^\d{1,2}$/.test(i.str) && Math.abs(i.x - h.x) < 25 && Math.abs(i.y - headerY) < 30);
              if (dateItem) {
                columns.push({
                  dayName: h.name,
                  dayNum: parseInt(dateItem.str, 10),
                  x: h.x
                });
              }
            });

            if (columns.length === 0) continue;

            let kevinItem = items.find(i => i.str === "Kevin");
            if (!kevinItem) continue;

            let kevinRowItems = items.filter(i => 
              Math.abs(i.y - kevinItem.y) < 8 && 
              i.str !== "Kevin" && 
              i.str !== "FT" &&
              i.x >= minX && 
              i.x <= maxX
            );

            let pageWeek = {
              weekLabel: weekLabel,
              days: []
            };

            columns.forEach(col => {
              let matched = kevinRowItems.filter(i => Math.abs(i.x - col.x) < 22);
              let cellText = matched.length > 0 ? matched.map(m => m.str).join(" ") : "";

              let isOff = /^(x|al|sl|cl|rdu)$/i.test(cellText) || cellText.toLowerCase().startsWith("x ") || cellText === "";
              
              let locCode = fileMeta.defaultLocCode;
              let fullLoc = fileMeta.defaultLoc;
              for (let code in locationMap) {
                if (cellText.includes(code)) {
                  locCode = code;
                  fullLoc = locationMap[code];
                  break;
                }
              }

              let times = cellText.match(/(\d{4})-(\d{4})/);
              let start = "";
              let end = "";
              let hoursStr = "OFF";

              if (times) {
                start = `${times[1].slice(0,2)}:${times[1].slice(2)}`;
                end = `${times[2].slice(0,2)}:${times[2].slice(2)}`;
                hoursStr = `${start}-${end}`;
              } else if (!isOff) {
                hoursStr = cellText;
              }

              let dayFormatted = String(col.dayNum).padStart(2, '0');
              pageWeek.days.push({
                dateNum: col.dayNum,
                dayName: col.dayName,
                fullDate: `${fileMeta.year}-${fileMeta.month}-${dayFormatted}`,
                isOff: isOff,
                locCode: isOff ? 'OFF' : locCode,
                fullLoc: fullLoc,
                hours: hoursStr,
                start: start,
                end: end,
                raw: cellText
              });
            });

            weeklyData.push(pageWeek);
          }
        } catch (err) {
          log.textContent += `\nError reading ${file.name}: ${err.message}`;
        }
      }

      return { weeklyData, detectedMeta };
    }

    icsBtn.addEventListener('click', async () => {
      let { weeklyData, detectedMeta } = await parseWeeklySchedules();
      let events = [];

      weeklyData.forEach(w => {
        w.days.forEach(d => {
          if (!d.isOff) {
            events.push({
              date: d.fullDate,
              dayNum: d.dateNum,
              start: d.start,
              end: d.end,
              location: d.fullLoc,
              raw: d.raw
            });
          }
        });
      });

      if (events.length === 0) {
        log.textContent += "\nNo active work shifts found for Kevin.";
        return;
      }
      
      let outName = `Kevin_Schedule_${detectedMeta.monthStr}_${detectedMeta.year}.ics`;
      log.textContent += `\nSuccessfully parsed ${events.length} working shifts!\nDownloading ${outName}...`;
      downloadICS(events, outName);
    });

    pdfBtn.addEventListener('click', async () => {
      let { weeklyData, detectedMeta } = await parseWeeklySchedules();
      if (weeklyData.length === 0) {
        log.textContent += "\nNo schedule data found for Kevin.";
        return;
      }
      
      let outName = `Kevin_Schedule_Calendar_${detectedMeta.monthStr}_${detectedMeta.year}.pdf`;
      log.textContent += `\nSuccessfully parsed ${weeklyData.length} weekly rosters!\nDownloading ${outName}...`;
      generateCalendarPDF(weeklyData, detectedMeta, outName);
    });

    function downloadICS(events, filename) {
      let icsContent = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Shift Schedule Extractor//EN'
      ];

      events.forEach(e => {
        let startTime = e.start ? e.start.replace(':', '') + '00' : '090000';
        let endTime = e.end ? e.end.replace(':', '') + '00' : '180000';

        let startISO = e.date.replace(/-/g, '') + 'T' + startTime;
        let endISO = e.date.replace(/-/g, '') + 'T' + endTime;

        icsContent.push(
          'BEGIN:VEVENT',
          `SUMMARY:Work @ ${e.location}`,
          `DTSTART:${startISO}`,
          `DTEND:${endISO}`,
          `LOCATION:${e.location}`,
          `DESCRIPTION:Shift Details: ${e.raw}`,
          'END:VEVENT'
        );
      });

      icsContent.push('END:VCALENDAR');

      const blob = new Blob([icsContent.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
      const link = document.createElement('a');
      link.href = window.URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    }

    function generateCalendarPDF(weeklyData, meta, filename) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('landscape');

      doc.setFontSize(16);
      doc.text(`Kevin's Work Schedule - ${meta.monthStr} ${meta.year}`, 14, 15);

      let startY = 25;

      weeklyData.forEach((week, index) => {
        let dayHeaders = week.days.map(d => d.dayName);
        let dateNumbers = week.days.map(d => String(d.dateNum));
        let locations = week.days.map(d => d.locCode);
        let hours = week.days.map(d => d.hours);

        doc.setFontSize(12);
        doc.text(`Master Week: ${week.weekLabel}`, 14, startY);

        doc.autoTable({
          startY: startY + 4,
          head: [
            ['Metric', ...dayHeaders]
          ],
          body: [
            ['Date', ...dateNumbers],
            ['Location', ...locations],
            ['Hours / Shift', ...hours]
          ],
          theme: 'grid',
          headStyles: { fillColor: [0, 112, 243], halign: 'center', fontStyle: 'bold' },
          bodyStyles: { halign: 'center', fontSize: 10 },
          columnStyles: {
            0: { fontStyle: 'bold', fillColor: [240, 244, 248], cellWidth: 35 }
          },
          margin: { left: 14, right: 14 }
        });

        startY = doc.lastAutoTable.finalY + 12;

        if (startY > 170 && index < weeklyData.length - 1) {
          doc.addPage();
          startY = 20;
        }
      });

      doc.save(filename);
    }
  </script>
</body>
</html>
