<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kevin's Schedule Generator</title>
  <!-- PDF.js for reading PDFs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <!-- jsPDF & AutoTable for creating PDFs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: #333; }
    .dropzone { border: 2px dashed #0070f3; border-radius: 8px; padding: 40px; text-align: center; background: #f7f9fa; cursor: pointer; }
    .dropzone:hover { background: #f0f4f8; }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    button { background: #0070f3; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 15px; cursor: pointer; flex: 1; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #log { margin-top: 20px; white-space: pre-wrap; font-family: monospace; font-size: 13px; background: #eee; padding: 10px; border-radius: 4px; max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>

  <h2>Kevin's Monthly Schedule Generator</h2>
  <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
    <p>📄 Drop schedule PDFs here or click to upload</p>
    <input type="file" id="fileInput" multiple accept="application/pdf" style="display:none">
  </div>

  <div class="btn-group">
    <button id="processBtn" disabled>Generate .ICS & Summary PDF</button>
  </div>

  <div id="log">Upload PDFs to begin...</div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const locationMap = {
      'CY': 'Central Yard (CY)',
      'KT': 'Kennedy Town (KT)',
      'SK': 'Sai Kung (SK)',
      'OIE': 'Quarry Bay (OIE)',
      'PP': 'Pacific Place (PP)'
    };

    let filesList = [];
    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    const processBtn = document.getElementById('processBtn');
    const log = document.getElementById('log');

    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
    dropzone.addEventListener('dragover', (e) => e.preventDefault());
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      handleFiles(e.dataTransfer.files);
    });

    function handleFiles(files) {
      filesList = Array.from(files).filter(f => f.type === 'application/pdf');
      if (filesList.length > 0) {
        log.textContent = `Selected ${filesList.length} PDF file(s):\n` + filesList.map(f => `- ${f.name}`).join('\n');
        processBtn.disabled = false;
      }
    }

    processBtn.addEventListener('click', async () => {
      log.textContent = "Processing PDFs...\n";
      let events = [];

      for (let file of filesList) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          
          let items = textContent.items;
          let lines = {};
          items.forEach(item => {
            let y = Math.round(item.transform[5]);
            if (!lines[y]) lines[y] = [];
            lines[y].push(item.str);
          });

          let sortedY = Object.keys(lines).sort((a, b) => b - a);
          let dates = [];

          for (let y of sortedY) {
            let lineText = lines[y].join(' ').trim();

            if (lineText.includes('Mon') && lineText.includes('Tue')) {
              let idx = sortedY.indexOf(y);
              if (idx > 0) {
                let prevLine = lines[sortedY[idx - 1]].join(' ');
                dates = prevLine.match(/\b\d{1,2}\b/g) || [];
              }
            }

            if (lineText.startsWith('Kevin')) {
              let parts = lineText.split(/\s+/).slice(1).filter(p => p !== 'FT');

              dates.forEach((dayNum, index) => {
                let status = parts[index];
                if (!status || ['X', 'x', 'x (w2)', 'x (W1)', 'AL'].includes(status)) return;

                let loc = locationMap[status] || locationMap['PP'];
                let times = status.match(/(\d{4})-(\d{4})/);
                
                let start = times ? `${times[1].slice(0,2)}:${times[1].slice(2)}` : '09:30';
                let end = times ? `${times[2].slice(0,2)}:${times[2].slice(2)}` : '18:30';

                let dayFormatted = dayNum.padStart(2, '0');
                events.push({
                  date: `2026-09-${dayFormatted}`,
                  dayNum: dayNum,
                  start, end, location: loc, raw: status
                });
              });
            }
          }
        }
      }

      if (events.length === 0) {
        log.textContent += "\nNo scheduled working shifts found for Kevin.";
        return;
      }

      // Sort events chronologically
      events.sort((a, b) => parseInt(a.dayNum) - parseInt(b.dayNum));

      log.textContent += `\nFound ${events.length} working shifts for Kevin. Generating files...`;
      
      downloadICS(events);
      generatePDF(events);
    });

    function downloadICS(events) {
      let icsContent = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Shift Schedule Extractor//EN'
      ];

      events.forEach(e => {
        let startISO = e.date.replace(/-/g, '') + 'T' + e.start.replace(':', '') + '00';
        let endISO = e.date.replace(/-/g, '') + 'T' + e.end.replace(':', '') + '00';

        icsContent.push(
          'BEGIN:VEVENT',
          `SUMMARY:Work @ ${e.location}`,
          `DTSTART:${startISO}`,
          `DTEND:${endISO}`,
          `LOCATION:${e.location}`,
          `DESCRIPTION:Shift: ${e.raw}`,
          'END:VEVENT'
        );
      });

      icsContent.push('END:VCALENDAR');

      const blob = new Blob([icsContent.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
      const link = document.createElement('a');
      link.href = window.URL.createObjectURL(blob);
      link.download = 'Kevin_Schedule.ics';
      link.click();
    }

    function generatePDF(events) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(16);
      doc.text("Kevin's Work Schedule", 14, 20);

      const tableData = events.map(e => [
        e.date,
        e.location,
        `${e.start} - ${e.end}`,
        e.raw
      ]);

      doc.autoTable({
        startY: 30,
        head: [['Date', 'Location', 'Shift Time', 'Raw Code']],
        body: tableData,
        theme: 'striped',
        headStyles: { fillColor: [0, 112, 243] }
      });

      doc.save("Kevin_Schedule.pdf");
    }
  </script>
</body>
</html>
