<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kevin's Monthly Schedule Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; color: #333; }
    .dropzone { border: 2px dashed #0070f3; border-radius: 8px; padding: 40px; text-align: center; background: #f7f9fa; cursor: pointer; }
    .dropzone:hover { background: #f0f4f8; }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; background: #0070f3; color: white; border: none; padding: 12px 15px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #log { margin-top: 20px; white-space: pre-wrap; font-family: monospace; font-size: 13px; background: #eee; padding: 12px; border-radius: 4px; max-height: 250px; overflow-y: auto; }
  </style>
</head>
<body>

  <h2>Kevin's Monthly Schedule Generator</h2>
  <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
    <p>📄 Drop schedule PDFs here or click to upload</p>
    <input type="file" id="fileInput" multiple accept="application/pdf" style="display:none">
  </div>

  <div class="btn-group">
    <button id="icsBtn" disabled>📅 Generate .ICS Calendar</button>
    <button id="pdfBtn" disabled>📄 Generate Summary PDF</button>
  </div>

  <div id="log">Upload PDFs to begin...</div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const locationMap = {
      'CY': 'Central Yard (CY)',
      'KT': 'Kennedy Town (KT)',
      'SK': 'Sai Kung (SK)',
      'OIE': 'Quarry Bay (OIE)',
      'PP': 'Pacific Place (PP)'
    };

    const monthMap = {
      'JAN': '01', 'FEB': '02', 'MAR': '03', 'APR': '04',
      'MAY': '05', 'JUN': '06', 'JUL': '07', 'AUG': '08',
      'SEP': '09', 'SEPT': '09', 'OCT': '10', 'NOV': '11', 'DEC': '12'
    };

    const monthNamesUpper = {
      '01': 'JANUARY', '02': 'FEBRUARY', '03': 'MARCH', '04': 'APRIL',
      '05': 'MAY', '06': 'JUNE', '07': 'JULY', '08': 'AUGUST',
      '09': 'SEPTEMBER', '10': 'OCTOBER', '11': 'NOVEMBER', '12': 'DECEMBER'
    };

    const dayNames = ["Mon", "Tue", "Wed", "Thur", "Fri", "Sat", "Sun"];

    let filesList = [];
    let detectedMonthCode = "09";
    let detectedMonthStr = "SEPTEMBER";
    let detectedYearStr = "2026";

    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    const icsBtn = document.getElementById('icsBtn');
    const pdfBtn = document.getElementById('pdfBtn');
    const log = document.getElementById('log');

    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
    dropzone.addEventListener('dragover', (e) => e.preventDefault());
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      handleFiles(e.dataTransfer.files);
    });

    function handleFiles(files) {
      filesList = Array.from(files).filter(f => f.type === 'application/pdf');
      if (filesList.length > 0) {
        log.textContent = `Selected ${filesList.length} PDF file(s):\n` + filesList.map(f => `- ${f.name}`).join('\n');
        icsBtn.disabled = false;
        pdfBtn.disabled = false;
      }
    }

    function extractMetadataFromFileName(filename) {
      let fileStoreCode = 'PP';
      let fileStoreName = 'Pacific Place (PP)';
      let year = '2026';
      let month = '09';

      for (let code in locationMap) {
        let regex = new RegExp(`[\\b_]${code}[\\b_.]`, 'i');
        if (regex.test(filename)) {
          fileStoreCode = code;
          fileStoreName = locationMap[code];
          break;
        }
      }

      let yearMatch = filename.match(/\b(202\d)\b/);
      if (yearMatch) year = yearMatch[1];

      for (let m in monthMap) {
        if (filename.toUpperCase().includes(m)) {
          month = monthMap[m];
          break;
        }
      }

      return { fileStoreCode, fileStoreName, year, month };
    }

    function formatTimeString(rawTime) {
      let clean = rawTime.replace(/[^\d]/g, '');
      if (clean.length === 3) clean = '0' + clean;
      if (clean.length === 4) {
        return `${clean.slice(0, 2)}:${clean.slice(2)}`;
      }
      return rawTime;
    }

    function parseShiftTime(text) {
      let match = text.match(/(\d{1,2}:?\d{2})\s*[-–—]\s*(\d{1,2}:?\d{2})/);
      if (match) {
        return {
          start: formatTimeString(match[1]),
          end: formatTimeString(match[2])
        };
      }
      return null;
    }

    async function parseScheduleEvents() {
      log.textContent = "Processing PDF pages...\n";
      let rawEntriesByDate = {}; 

      for (let file of filesList) {
        const fileMeta = extractMetadataFromFileName(file.name);
        
        detectedYearStr = fileMeta.year;
        detectedMonthCode = fileMeta.month;
        if (monthNamesUpper[fileMeta.month]) {
          detectedMonthStr = monthNamesUpper[fileMeta.month];
        }

        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        
        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const textContent = await page.getTextContent();
          
          let items = textContent.items.map(item => ({
            x: Math.round(item.transform[4]),
            y: Math.round(item.transform[5]),
            str: item.str.trim()
          })).filter(i => i.str.length > 0);

          let headers = [];
          dayNames.forEach(d => {
            let found = items.find(i => i.str === d);
            if (found) headers.push({ name: d, x: found.x, y: found.y });
          });

          if (headers.length < 1) continue;

          headers.sort((a, b) => a.x - b.x);

          let minX = headers[0].x - 15;
          let maxX = headers[headers.length - 1].x + 35;
          let headerY = headers[0].y;

          let columns = [];
          headers.forEach(h => {
            let dateItem = items.find(i => /^\d{1,2}$/.test(i.str) && Math.abs(i.x - h.x) < 25 && Math.abs(i.y - headerY) < 30);
            if (dateItem) {
              columns.push({
                dayName: h.name,
                dayNum: parseInt(dateItem.str, 10),
                x: h.x
              });
            }
          });

          if (columns.length === 0) continue;

          let kevinItem = items.find(i => i.str === "Kevin");
          if (!kevinItem) continue;

          let kevinRowItems = items.filter(i => 
            Math.abs(i.y - kevinItem.y) < 14 && 
            i.str !== "Kevin" && 
            i.str !== "FT" &&
            i.x >= minX && 
            i.x <= maxX
          );

          columns.forEach(col => {
            let matched = kevinRowItems.filter(i => Math.abs(i.x - col.x) < 25);
            if (matched.length === 0) return;

            let cellText = matched.map(m => m.str).join(" ").trim();

            let targetYear = parseInt(fileMeta.year, 10);
            let targetMonth = parseInt(fileMeta.month, 10);

            if (col.dayNum > 25 && columns.indexOf(col) < 3 && pageNum === 1) {
              targetMonth -= 1;
              if (targetMonth === 0) {
                targetMonth = 12;
                targetYear -= 1;
              }
            }

            let monthFormatted = String(targetMonth).padStart(2, '0');
            let dayFormatted = String(col.dayNum).padStart(2, '0');
            let dateKey = `${targetYear}-${monthFormatted}-${dayFormatted}`;

            if (!rawEntriesByDate[dateKey]) {
              rawEntriesByDate[dateKey] = [];
            }

            rawEntriesByDate[dateKey].push({
              sourceStoreCode: fileMeta.fileStoreCode,
              sourceStoreName: fileMeta.fileStoreName,
              dayNum: col.dayNum,
              cellText: cellText
            });
          });
        }
      }

      let finalEvents = [];

      for (let dateKey in rawEntriesByDate) {
        let entries = rawEntriesByDate[dateKey];
        let primaryShiftTime = null;
        let actualLocationName = null;
        let isOffDay = false;
        let combinedRaw = [];

        entries.forEach(entry => {
          combinedRaw.push(`${entry.sourceStoreCode}: ${entry.cellText}`);
          
          if (/^(x|x \(w2\)|al|sl|cl|rdu)$/i.test(entry.cellText) || entry.cellText.toLowerCase().startsWith("x ")) {
            isOffDay = true;
          }

          let parsedTime = parseShiftTime(entry.cellText);
          if (parsedTime && !primaryShiftTime) {
            primaryShiftTime = parsedTime;
            actualLocationName = entry.sourceStoreName;
          }
        });

        if (!actualLocationName) {
          for (let entry of entries) {
            for (let code in locationMap) {
              if (new RegExp(`\\b${code}\\b`, 'i').test(entry.cellText)) {
                actualLocationName = locationMap[code];
                break;
              }
            }
            if (actualLocationName) break;
          }
        }

        if (!actualLocationName && entries.length > 0) {
          actualLocationName = entries[0].sourceStoreName;
        }

        finalEvents.push({
          date: dateKey,
          dayNum: entries[0].dayNum,
          isOffDay: isOffDay && !primaryShiftTime,
          start: primaryShiftTime ? primaryShiftTime.start : null,
          end: primaryShiftTime ? primaryShiftTime.end : null,
          isTimeMissing: !primaryShiftTime && !isOffDay,
          location: isOffDay && !primaryShiftTime ? 'OFF' : actualLocationName,
          raw: combinedRaw.join(" | ")
        });
      }

      return finalEvents.sort((a, b) => a.date.localeCompare(b.date));
    }

    icsBtn.addEventListener('click', async () => {
      let uniqueEvents = await parseScheduleEvents();
      let workingShifts = uniqueEvents.filter(e => !e.isOffDay);
      if (workingShifts.length === 0) {
        log.textContent += "\nNo active work shifts found for Kevin.";
        return;
      }
      const filename = `Kevin_Schedule_${detectedMonthStr}_${detectedYearStr}.ics`;
      log.textContent += `\nSuccessfully reconciled ${workingShifts.length} working shift days!\nDownloading ${filename}...`;
      downloadICS(workingShifts, filename);
    });

    pdfBtn.addEventListener('click', async () => {
      let uniqueEvents = await parseScheduleEvents();
      if (uniqueEvents.length === 0) {
        log.textContent += "\nNo active work shifts found for Kevin.";
        return;
      }
      const filename = `Kevin_Schedule_${detectedMonthStr}_${detectedYearStr}.pdf`;
      log.textContent += `\nSuccessfully reconciled ${uniqueEvents.length} schedule days!\nDownloading ${filename}...`;
      generatePDF(uniqueEvents, filename);
    });

    function downloadICS(events, filename) {
      let icsContent = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Shift Schedule Extractor//EN'
      ];

      events.forEach(e => {
        let startTime = e.start ? e.start.replace(':', '') + '00' : '090000';
        let endTime = e.end ? e.end.replace(':', '') + '00' : '180000';

        let startISO = e.date.replace(/-/g, '') + 'T' + startTime;
        let endISO = e.date.replace(/-/g, '') + 'T' + endTime;

        icsContent.push(
          'BEGIN:VEVENT',
          `SUMMARY:${e.location}${e.isTimeMissing ? ' (TBD)' : ''}`,
          `DTSTART:${startISO}`,
          `DTEND:${endISO}`,
          `LOCATION:${e.location}`,
          `DESCRIPTION:Roster Sources: ${e.raw}${e.isTimeMissing ? ' | Time: TBD' : ''}`,
          'END:VEVENT'
        );
      });

      icsContent.push('END:VCALENDAR');

      const blob = new Blob([icsContent.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
      const link = document.createElement('a');
      link.href = window.URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    }

    function generatePDF(events, filename) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'mm', 'a4');

      // --- PAGE 1: Detailed List Table ---
      doc.setFontSize(16);
      doc.text(`Kevin's Work Schedule - ${detectedMonthStr} ${detectedYearStr}`, 14, 20);

      const tableData = events.map(e => [
        e.date,
        e.location,
        e.isOffDay ? 'OFF' : (e.isTimeMissing ? 'TBD' : `${e.start} - ${e.end}`),
        e.raw
      ]);

      doc.autoTable({
        startY: 30,
        head: [['Date', 'Location', 'Shift Time', 'Roster Entry Details']],
        body: tableData,
        theme: 'striped',
        headStyles: { fillColor: [0, 112, 243] }
      });

      // --- PAGE 2: Monthly Visual Calendar View ---
      doc.addPage();

      doc.setFontSize(16);
      doc.setFont("helvetica", "bold");
      doc.text(`Calendar View - ${detectedMonthStr} ${detectedYearStr}`, 14, 18);

      const startX = 14;
      const startY = 32;
      const cellWidth = 26;
      const cellHeight = 22;
      const headers = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

      // Draw Day Name Headers
      doc.setFontSize(10);
      doc.setFont("helvetica", "bold");
      headers.forEach((h, i) => {
        const x = startX + (i * cellWidth);
        doc.setFillColor(240, 244, 248);
        doc.rect(x, startY - 7, cellWidth, 7, 'F');
        doc.setDrawColor(200, 200, 200);
        doc.rect(x, startY - 7, cellWidth, 7, 'S');
        doc.text(h, x + (cellWidth / 2), startY - 2, { align: 'center' });
      });

      // Map events by date key for fast lookup
      const eventMap = {};
      events.forEach(e => { eventMap[e.date] = e; });

      // Target explicit target month/year rather than relying on events[0]
      let gridYear = parseInt(detectedYearStr, 10);
      let gridMonthIdx = parseInt(detectedMonthCode, 10) - 1; // 0-indexed for JS Date

      let firstDayOfMonth = new Date(gridYear, gridMonthIdx, 1);
      let daysInMonth = new Date(gridYear, gridMonthIdx + 1, 0).getDate();

      // Convert Sunday (0) -> 6, Monday (1) -> 0 for Mon-Sun alignment
      let startingDay = (firstDayOfMonth.getDay() + 6) % 7;

      let currentDay = 1;
      let row = 0;

      while (currentDay <= daysInMonth) {
        for (let col = 0; col < 7; col++) {
          if (row === 0 && col < startingDay) {
            // Empty leading square for previous month days
            const x = startX + (col * cellWidth);
            const y = startY + (row * cellHeight);
            doc.setDrawColor(230, 230, 230);
            doc.rect(x, y, cellWidth, cellHeight, 'S');
          } else if (currentDay <= daysInMonth) {
            const x = startX + (col * cellWidth);
            const y = startY + (row * cellHeight);

            doc.setDrawColor(200, 200, 200);
            doc.rect(x, y, cellWidth, cellHeight, 'S');

            // Date number label
            doc.setFontSize(9);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(50, 50, 50);
            doc.text(String(currentDay), x + 2, y + 5);

            // Match current calendar grid cell date key
            let monthStr = String(gridMonthIdx + 1).padStart(2, '0');
            let dayStr = String(currentDay).padStart(2, '0');
            let dateKey = `${gridYear}-${monthStr}-${dayStr}`;

            let ev = eventMap[dateKey];
            if (ev) {
              if (ev.isOffDay) {
                doc.setFontSize(8);
                doc.setFont("helvetica", "normal");
                doc.setTextColor(150, 150, 150);
                doc.text("OFF", x + (cellWidth / 2), y + 13, { align: 'center' });
              } else {
                // Get display location (short code if present, otherwise full name)
                let locShort = ev.location;
                let matchLoc = ev.location.match(/\(([^)]+)\)/);
                if (matchLoc) {
                  locShort = matchLoc[1];
                }

                doc.setFontSize(8);
                doc.setFont("helvetica", "bold");
                doc.setTextColor(0, 112, 243);
                doc.text(locShort, x + (cellWidth / 2), y + 11, { align: 'center' });

                let timeStr = ev.isTimeMissing ? 'TBD' : `${ev.start}-${ev.end}`;
                doc.setFontSize(6.5);
                doc.setFont("helvetica", "normal");
                doc.setTextColor(80, 80, 80);
                doc.text(timeStr, x + (cellWidth / 2), y + 17, { align: 'center' });
              }
            }

            currentDay++;
          }
        }
        row++;
      }

      doc.save(filename);
    }
  </script>
</body>
</html>
