<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roster Monthly Schedule Generator & Conflict Resolver</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }
    .upload-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      text-align: center;
      background: var(--card-bg);
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .drop-zone:hover {
      border-color: var(--primary);
    }
    .drop-zone input {
      display: none;
    }
    .file-list {
      margin-top: 0.5rem;
      font-size: 0.875rem;
      text-align: left;
    }
    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn:hover {
      background-color: var(--primary-hover);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .log-box {
      background: #1e293b;
      color: #f1f5f9;
      padding: 1rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.85rem;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 1rem;
    }
    .status-summary {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      font-size: 0.875rem;
      font-weight: 600;
    }
    .badge-ok { color: #16a34a; }
    .badge-warn { color: #d97706; }
    .badge-err { color: #dc2626; }
    
    @media (max-width: 768px) {
      body { padding: 0.75rem; }
      .upload-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Monthly Roster Generator & Conflict Resolver</h1>
    
    <div class="upload-grid">
      <div class="drop-zone" onclick="document.getElementById('filesA').click()">
        <strong>Box A (Primary / Original Rosters)</strong>
        <p style="font-size: 0.8rem; color: #64748b; margin-top: 0.25rem;">Select PDFs from PP, CY, KT, SK, OIE</p>
        <input type="file" id="filesA" multiple accept="application/pdf" onchange="handleFiles(this.files, 'A')">
        <div id="listA" class="file-list"></div>
      </div>

      <div class="drop-zone" onclick="document.getElementById('filesB').click()">
        <strong>Box B (Revised Rosters - Optional)</strong>
        <p style="font-size: 0.8rem; color: #64748b; margin-top: 0.25rem;">Upload revised versions to highlight diffs</p>
        <input type="file" id="filesB" multiple accept="application/pdf" onchange="handleFiles(this.files, 'B')">
        <div id="listB" class="file-list"></div>
      </div>
    </div>

    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
      <button class="btn" id="processBtn" onclick="processRosters()">Process Roster Schedules</button>
      <button class="btn" id="pdfBtn" style="background:#059669; display:none;" onclick="downloadPDF()">Export PDF Report</button>
      <button class="btn" id="icsBtn" style="background:#7c3aed; display:none;" onclick="exportICS()">Generate .ICS Calendar</button>
    </div>

    <div id="statusSummary" class="status-summary"></div>
    <div id="log" class="log-box">System Ready. Please select PDF rosters...</div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let state = {
      filesA: [],
      filesB: [],
      resolvedEvents: [],
      memberName: 'KEVIN'
    };

    function handleFiles(files, box) {
      const arr = box === 'A' ? state.filesA : state.filesB;
      for (let file of files) {
        if (!arr.some(f => f.name === file.name)) {
          arr.push(file);
        }
      }
      renderFileList(box);
    }

    function renderFileList(box) {
      const listDiv = document.getElementById(box === 'A' ? 'listA' : 'listB');
      const arr = box === 'A' ? state.filesA : state.filesB;
      listDiv.innerHTML = arr.map((f, i) => `<div>📄 ${f.name}</div>`).join('');
    }

    function log(msg) {
      const l = document.getElementById('log');
      l.innerHTML += `<div>> ${msg}</div>`;
      l.scrollTop = l.scrollHeight;
    }

    async function parsePdf(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let textItems = [];

      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        const viewport = page.getViewport({ scale: 1.0 });

        content.items.forEach(item => {
          textItems.push({
            text: item.str.trim(),
            x: Math.round(item.transform[4]),
            y: Math.round(viewport.height - item.transform[5]),
            page: p
          });
        });
      }
      return textItems;
    }

    function inferStoreFromFilename(filename) {
      const fn = filename.toUpperCase();
      if (fn.includes('PP') || fn.includes('PACIFIC')) return 'PP';
      if (fn.includes('CY') || fn.includes('CAUSEWAY')) return 'CY';
      if (fn.includes('KT') || fn.includes('KENNEDY')) return 'KT';
      if (fn.includes('SK') || fn.includes('SAI KUNG')) return 'SK';
      if (fn.includes('OIE') || fn.includes('ONE ISLAND')) return 'OIE';
      return 'UNKNOWN';
    }

    async function processRosters() {
      if (state.filesA.length === 0) {
        alert('Please select at least one PDF for Box A.');
        return;
      }

      log('Starting parsing process...');
      document.getElementById('processBtn').disabled = true;

      try {
        const storeRostersA = {};
        for (let file of state.filesA) {
          const store = inferStoreFromFilename(file.name);
          log(`Parsing Box A Roster: ${file.name} (Inferred Store: ${store})`);
          const items = await parsePdf(file);
          storeRostersA[store] = extractShiftsForMember(items, store, state.memberName);
        }

        let storeRostersB = null;
        if (state.filesB.length > 0) {
          storeRostersB = {};
          for (let file of state.filesB) {
            const store = inferStoreFromFilename(file.name);
            log(`Parsing Box B (Revised) Roster: ${file.name}`);
            const items = await parsePdf(file);
            storeRostersB[store] = extractShiftsForMember(items, store, state.memberName);
          }
        }

        // Reconcile multi-store inputs using 2/3 Supermajority rule
        state.resolvedEvents = reconcileMultiStoreSchedules(storeRostersA, storeRostersB);
        
        displaySummaryStats();
        document.getElementById('pdfBtn').style.display = 'inline-flex';
        document.getElementById('icsBtn').style.display = 'inline-flex';
        log('Processing completed successfully!');
      } catch (err) {
        log(`ERROR: ${err.message}`);
        console.error(err);
      } finally {
        document.getElementById('processBtn').disabled = false;
      }
    }

    function extractShiftsForMember(items, defaultStore, memberName) {
      // Find Member Row
      const memberItem = items.find(i => i.text.toUpperCase().includes(memberName));
      if (!memberItem) return {};

      // Find Date Columns
      const dateItems = items.filter(i => /^\d{1,2}\/\d{1,2}$\vert{}^\d{1,2}$/.test(i.text) && i.y < memberItem.y + 100 && i.y > memberItem.y - 100);
      
      const shiftsByDate = {};
      
      // Strict Spatial Filtering (Y-axis within 8px, X-axis within 18px)
      const memberRowItems = items.filter(i => Math.abs(i.y - memberItem.y) <= 8);

      dateItems.forEach(col => {
        const cellItems = memberRowItems.filter(i => Math.abs(i.x - col.x) <= 18);
        const cellText = cellItems.map(i => i.text).join(' ').trim();

        if (!cellText || /^x$/i.test(cellText) || /^al$/i.test(cellText) \vert{}\vert{} /^sl$/i.test(cellText)) {
          shiftsByDate[col.text] = { location: 'OFF', time: '', isOff: true };
          return;
        }

        // Extract shift location & time
        let loc = defaultStore;
        let time = '';

        const timeMatch = cellText.match(/(\d{2}:?\d{2})\s*[-~]\s*(\d{2}:?\d{2})/);
        if (timeMatch) {
          time = `${timeMatch[1]}-${timeMatch[2]}`;
        }

        const storeMatch = cellText.match(/\b(PP|CY|KT|SK|OIE)\b/i);
        if (storeMatch) {
          loc = storeMatch[1].toUpperCase();
        }

        shiftsByDate[col.text] = { location: loc, time: time, isOff: false, raw: cellText };
      });

      return shiftsByDate;
    }

    function reconcileMultiStoreSchedules(rostersA, rostersB) {
      // Collect all unique dates across all parsed rosters
      const allDates = new Set();
      Object.values(rostersA).forEach(r => Object.keys(r).forEach(d => allDates.add(d)));

      const resolved = [];

      allDates.forEach(date => {
        const votes = [];
        Object.entries(rostersA).forEach(([store, schedule]) => {
          if (schedule[date] && !schedule[date].isOff) {
            votes.push({ sourceStore: store, loc: schedule[date].location, time: schedule[date].time });
          }
        });

        let dayResult = resolveConsensus(date, votes);

        // If Box B (Revision) exists, compare and mark diff
        if (rostersB) {
          const votesB = [];
          Object.entries(rostersB).forEach(([store, schedule]) => {
            if (schedule[date] && !schedule[date].isOff) {
              votesB.push({ sourceStore: store, loc: schedule[date].location, time: schedule[date].time });
            }
          });
          const resultB = resolveConsensus(date, votesB);

          if (resultB.location !== dayResult.location || resultB.time !== dayResult.time) {
            dayResult.isRevised = true;
            dayResult.oldLocation = dayResult.location;
            dayResult.oldTime = dayResult.time;
            dayResult.location = resultB.location;
            dayResult.time = resultB.time;
            dayResult.status = resultB.status;
          }
        }

        resolved.push(dayResult);
      });

      return resolved.sort((a,b) => parseInt(a.date) - parseInt(b.date));
    }

    function resolveConsensus(date, votes) {
      if (votes.length === 0) {
        return { date, location: 'OFF', time: '', status: 'OK', flagColor: null };
      }

      // Count location frequency
      const locCounts = {};
      let totalVotes = votes.length;

      votes.forEach(v => {
        locCounts[v.loc] = (locCounts[v.loc] || 0) + 1;
      });

      // Find top vote getter
      let maxVotes = 0;
      let topLoc = '';
      Object.entries(locCounts).forEach(([loc, count]) => {
        if (count > maxVotes) {
          maxVotes = count;
          topLoc = loc;
        }
      });

      // Calculate Ratio
      const consensusRatio = maxVotes / totalVotes;

      // Extract time from votes matching the top location
      const matchingTimeVote = votes.find(v => v.loc === topLoc && v.time);
      const timeStr = matchingTimeVote ? matchingTimeVote.time : '09:30-18:30';

      // RULE APPLICATION:
      // 1. 100% Consensus -> OK (Blue / Plain)
      if (consensusRatio === 1.0) {
        return { date, location: topLoc, time: timeStr, status: 'OK', flagColor: null };
      }

      // 2. Supermajority >= 2/3 (66.7%) -> Rule B: Majority Wins, Yellow Flag
      // E.g., 4 out of 5 stores (80%), or 3 out of 4 stores (75%)
      if (consensusRatio >= 0.667) {
        return { 
          date, 
          location: topLoc, 
          time: timeStr, 
          status: 'WARN_DISCREPANCY', 
          flagColor: '#FEF08A', // Yellow
          note: `Minority discrepancy in 1 store. Majority (${maxVotes}/${totalVotes}) points to ${topLoc}.`
        };
      }

      // 3. Ratio < 2/3 (e.g. 3 vs 2 split = 60%, 2 vs 2 split = 50%) -> Rule C: Hard Conflict, Red Flag
      return { 
        date, 
        location: 'CONFLICT', 
        time: 'TBD', 
        status: 'ERR_CONFLICT', 
        flagColor: '#FCA5A5', // Red
        note: `CHECK WITH MANAGER. CONFLICT SCHEDULING (${maxVotes}/${totalVotes} split).`
      };
    }

    function displaySummaryStats() {
      const okCount = state.resolvedEvents.filter(e => e.status === 'OK').length;
      const warnCount = state.resolvedEvents.filter(e => e.status === 'WARN_DISCREPANCY').length;
      const errCount = state.resolvedEvents.filter(e => e.status === 'ERR_CONFLICT').length;

      const summaryDiv = document.getElementById('statusSummary');
      summaryDiv.innerHTML = `
        <span class="badge-ok">✔ Clean: ${okCount} Days</span>
        <span class="badge-warn">⚠️ Discrepancies (Yellow): ${warnCount} Days</span>
        <span class="badge-err">🚨 Hard Conflicts (Red): ${errCount} Days</span>
      `;
    }

    function exportICS() {
      let icsContent = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Roster Conflict Resolver//EN',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH'
      ];

      state.resolvedEvents.forEach(e => {
        if (e.location === 'OFF') return;

        let summary = `${e.location} Shift`;
        if (e.status === 'ERR_CONFLICT') {
          summary = `🚨 CONFLICT SCHEDULING - CHECK WITH MANAGER`;
        } else if (e.status === 'WARN_DISCREPANCY') {
          summary = `⚠️ ${e.location} Shift (Verify Location)`;
        }

        icsContent.push(
          'BEGIN:VEVENT',
          `SUMMARY:${summary}`,
          `LOCATION:${e.location}`,
          `DESCRIPTION:${e.note || 'Roster shift entry'}`,
          'END:VEVENT'
        );
      });

      icsContent.push('END:VCALENDAR');

      const blob = new Blob([icsContent.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
      const link = document.createElement('a');
      link.href = window.URL.createObjectURL(blob);
      link.setAttribute('download', 'Roster_Schedule.ics');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(16);
      doc.text("Monthly Roster & Conflict Resolution Summary", 14, 15);

      const tableData = state.resolvedEvents.map(e => [
        `Day ${e.date}`,
        e.location,
        e.time,
        e.status === 'ERR_CONFLICT' ? '🚨 Hard Conflict' : (e.status === 'WARN_DISCREPANCY' ? '⚠️ Discrepancy' : 'OK'),
        e.note || ''
      ]);

      doc.autoTable({
        startY: 25,
        head: [['Date', 'Location', 'Time', 'Status', 'Notes']],
        body: tableData,
        didParseCell: function(data) {
          if (data.section === 'body') {
            const rowEv = state.resolvedEvents[data.row.index];
            if (rowEv.flagColor) {
              data.cell.styles.fillColor = rowEv.flagColor;
            }
          }
        }
      });

      doc.save('Monthly_Roster_Summary.pdf');
    }
  </script>
</body>
</html>
